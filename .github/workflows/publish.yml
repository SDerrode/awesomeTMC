name: Publish to PyPI

# Publishing uses PyPI "trusted publishing" (OpenID Connect): no API token is
# stored in the repository.  One-time setup, on pypi.org (and test.pypi.org):
#   Project awesomeTMC -> Publishing -> add a GitHub trusted publisher with
#   owner SDerrode, repository awesomeTMC, workflow publish.yml,
#   environment pypi (testpypi for TestPyPI).
# For a project that does not exist yet, use "pending publisher" in the account
# settings.  Then create the two environments in the GitHub repository settings
# (Settings -> Environments); a required reviewer on "pypi" is recommended.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      repository:
        description: "Where to publish (a manual run never targets the real PyPI)"
        type: choice
        options: [testpypi]
        default: testpypi

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Check that the release tag matches the package version
        if: github.event_name == 'release'
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pyproject.toml version ${version}" >&2
            exit 1
          fi

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build sdist + wheel
        run: python -m build

      - name: Validate package metadata
        run: twine check --strict dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    # Real PyPI: only for a published GitHub Release.
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/awesomeTMC/
    permissions:
      id-token: write  # required for trusted publishing

    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-testpypi:
    # Dry run: manual trigger only, goes to TestPyPI.
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/awesomeTMC/
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
